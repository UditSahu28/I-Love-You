<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 You Are My Forever 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020007;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ── Layers ── */
        #matrix-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.45;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* ── Vignette ── */
        #vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                transparent 40%,
                rgba(2,0,7,0.55) 75%,
                rgba(2,0,7,0.9) 100%
            );
        }

        /* ── Floating Sparkles ── */
        .sparkle {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            font-size: 18px;
            opacity: 0;
            animation: floatUp linear infinite;
            text-shadow: 0 0 8px #ff69b4, 0 0 16px #ff1493;
        }

        @keyframes floatUp {
            0%   { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* ── Shooting Stars ── */
        .shooting-star {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,182,193,1), rgba(255,255,255,0));
            border-radius: 50%;
            opacity: 0;
            animation: shoot linear forwards;
        }

        @keyframes shoot {
            0%   { opacity: 0; transform: translateX(0) translateY(0); }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(800px) translateY(300px); }
        }

        /* ── Click Ripple ── */
        @keyframes rippleOut {
            0%   { width: 0;    height: 0;    opacity: 1;   border-width: 4px; }
            40%  { opacity: 0.7; }
            100% { width: 380px; height: 380px; opacity: 0; border-width: 1px; }
        }
        @keyframes rippleOut2 {
            0%   { width: 0;    height: 0;    opacity: 0.6; border-width: 2px; }
            100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; }
        }


    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="canvas-container"></div>
    <div id="vignette"></div>


    <script>
    // ══════════════════════════════════════════════════
    //  1. MATRIX RAIN  — romantic characters + gradient
    // ══════════════════════════════════════════════════
    const matrixCanvas = document.getElementById('matrix-canvas');
    const mCtx = matrixCanvas.getContext('2d');

    let mWidth  = matrixCanvas.width  = window.innerWidth;
    let mHeight = matrixCanvas.height = window.innerHeight;

    const chars   = '♥♡✿✦❤★愛LOVE♫✨💕0123456789';
    const fontSize = 15;
    let columns   = Math.floor(mWidth / fontSize);
    let drops     = Array(columns).fill(0).map(() => Math.random() * -80);

    // Per-column colour cycling offset
    const colHue = Array(columns).fill(0).map(() => Math.random() * 360);

    function drawMatrix() {
        mCtx.fillStyle = 'rgba(2, 0, 7, 0.18)';
        mCtx.fillRect(0, 0, mWidth, mHeight);
        mCtx.font = `${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;

            // Gradient: warm pink → rose-gold → soft white
            const hue = (colHue[i] + drops[i] * 3) % 360;
            const s   = 80 + Math.random() * 20;
            const l   = 55 + Math.random() * 30;
            mCtx.fillStyle = `hsl(${hue < 60 ? (320 + hue) : 330}, ${s}%, ${l}%)`;
            mCtx.fillText(text, x, y);
            colHue[i] = (colHue[i] + 0.5) % 360;

            if (y > mHeight && Math.random() > 0.972) drops[i] = 0;
            drops[i]++;
        }
    }

    // ══════════════════════════════════════════════════
    //  2. THREE.JS 3D PARTICLE SYSTEM
    // ══════════════════════════════════════════════════
    const container = document.getElementById('canvas-container');
    const scene     = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 100;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const particleCount = 6000;
    const geometry   = new THREE.BufferGeometry();
    const positions  = new Float32Array(particleCount * 3);
    const colors     = new Float32Array(particleCount * 3);
    const targetPos  = new Float32Array(particleCount * 3);

    // Warm romantic starting scatter
    for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i]     = (Math.random() - 0.5) * 350;
        positions[i + 1] = (Math.random() - 0.5) * 350;
        positions[i + 2] = (Math.random() - 0.5) * 350;
    }

    // Per-particle colour phase
    const colorPhase = new Float32Array(particleCount).map(() => Math.random() * Math.PI * 2);

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

    // Soft glow sprite
    function createGlowTexture() {
        const cv  = document.createElement('canvas');
        cv.width  = cv.height = 64;
        const ctx = cv.getContext('2d');
        const g   = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0,   'rgba(255,255,255,1)');
        g.addColorStop(0.25,'rgba(255,182,193,0.9)');
        g.addColorStop(0.6, 'rgba(255,20,147,0.5)');
        g.addColorStop(1,   'rgba(180,0,100,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(cv);
    }

    const material = new THREE.PointsMaterial({
        size: 2.8,
        map: createGlowTexture(),
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // ── Helper: update vertex colors — burst-phase aware
    function updateColors(time) {
        const col = geometry.attributes.color.array;
        const now = performance.now();

        for (let i = 0; i < particleCount; i++) {
            const phase = colorPhase[i] + time * 0.6;
            // Base romantic palette: crimson → rose-gold → hot-pink → soft-white
            const rBase = 0.85 + 0.15 * Math.sin(phase);
            const gBase = 0.10 + 0.30 * Math.abs(Math.sin(phase * 0.7 + 1.0));
            const bBase = 0.30 + 0.35 * Math.abs(Math.sin(phase * 0.5 + 2.0));

            let r = rBase, g = gBase, b = bBase;

            if (burstPhase === 'explode') {
                // ── Flash to blinding gold-white at peak of explosion ──
                const t     = Math.min(1, (now - burstPhaseStart) / DUR_EXPLODE);
                const flash = Math.sin(t * Math.PI); // bell curve — peaks mid-explosion
                r = rBase + (1.00 - rBase) * flash;
                g = gBase + (0.88 - gBase) * flash;
                b = bBase + (0.55 - bBase) * flash;

            } else if (burstPhase === 'drift') {
                // ── Cool, ethereal blue-violet while suspended ──
                const t = Math.min(1, (now - burstPhaseStart) / DUR_DRIFT);
                const ease = t * t * (3 - 2 * t); // smoothstep
                r = rBase * (1 - ease * 0.55);
                g = gBase * (1 - ease * 0.30) + ease * 0.15;
                b = bBase + ease * 0.50;

            } else if (burstPhase === 'reassemble') {
                // ── Warm back to rose as they magnetically return ──
                const t = Math.min(1, (now - burstPhaseStart) / DUR_REASSEMBLE);
                const ease = t * t * (3 - 2 * t);
                // Start from drift-end colours, blend back to base
                const rDrift = rBase * 0.45;
                const gDrift = gBase * 0.70 + 0.15;
                const bDrift = bBase + 0.50;
                r = rDrift + (rBase - rDrift) * ease;
                g = gDrift + (gBase - gDrift) * ease;
                b = bDrift + (bBase - bDrift) * ease;
            }

            col[i * 3]     = Math.min(1, r);
            col[i * 3 + 1] = Math.min(1, g);
            col[i * 3 + 2] = Math.min(1, b);
        }
        geometry.attributes.color.needsUpdate = true;
    }

    // ══════════════════════════════════════════════════
    //  3. SHAPE GENERATORS
    // ══════════════════════════════════════════════════
    function getOffscreenPoints(text, fontScale = 1) {
        const cv  = document.createElement('canvas');
        const ctx = cv.getContext('2d');
        cv.width  = cv.height = 400;

        ctx.font         = `bold ${Math.floor(80 * fontScale)}px sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = '#fff';
        ctx.fillText(text, 200, 200);

        const imgData = ctx.getImageData(0, 0, 400, 400);
        const pts = [];

        for (let y = 0; y < 400; y += 3) {
            for (let x = 0; x < 400; x += 3) {
                const idx = (y * 400 + x) * 4;
                if (imgData.data[idx + 3] > 128) {
                    pts.push({
                        x: (x - 200) * 0.35,
                        y: -(y - 200) * 0.35,
                        z: (Math.random() - 0.5) * 8
                    });
                }
            }
        }
        return pts;
    }

    function getHeartPoints() {
        const pts = [];
        for (let i = 0; i < particleCount; i++) {
            const t     = Math.random() * Math.PI * 2;
            const scale = 2.5;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 18; // deeper 3-D
            pts.push({ x: x * scale, y: y * scale, z });
        }
        // "I Love You" text overlay in the heart centre
        const textPts = getOffscreenPoints('I Love You', 0.42);
        for (let i = 0; i < textPts.length && i < pts.length; i++) {
            pts[i] = textPts[i];
        }
        return pts;
    }

    function setTargetShape(pts) {
        for (let i = 0; i < particleCount; i++) {
            const p = pts[i % pts.length];
            targetPos[i * 3]     = p.x;
            targetPos[i * 3 + 1] = p.y;
            targetPos[i * 3 + 2] = p.z;
        }
    }

    // ══════════════════════════════════════════════════
    //  4. CINEMATIC BURST — 3-phase: explode › drift › reassemble
    // ══════════════════════════════════════════════════
    const savedHeartPos = new Float32Array(particleCount * 3);
    const burstDest     = new Float32Array(particleCount * 3);
    // Per-particle lerp speed (default = normal animation speed)
    const pLerp         = new Float32Array(particleCount).fill(0.075);

    let burstPhase      = 'none'; // 'none' | 'explode' | 'drift' | 'reassemble'
    let burstPhaseStart = 0;

    const DUR_EXPLODE    =  900;   // ms — fast violent scatter
    const DUR_DRIFT      = 2200;   // ms — particles float, suspended in space
    const DUR_REASSEMBLE = 3400;   // ms — graceful, slow magnetic return

    function triggerBurst(cx, cy) {
        if (burstPhase !== 'none') return;

        // Snapshot current heart target positions
        for (let i = 0; i < particleCount * 3; i++) savedHeartPos[i] = targetPos[i];

        // ── Build explosion destinations ──
        // Power-curve radius so most particles fly far, a few stay close → depth
        for (let i = 0; i < particleCount; i++) {
            const angle  = Math.random() * Math.PI * 2;
            const elev   = (Math.random() - 0.5) * Math.PI;
            const radius = 55 + Math.pow(Math.random(), 0.5) * 210;
            burstDest[i*3]     = Math.cos(angle) * Math.cos(elev) * radius;
            burstDest[i*3 + 1] = Math.sin(elev) * radius;
            burstDest[i*3 + 2] = Math.sin(angle) * Math.cos(elev) * radius;
            // Staggered explosion speed → organic, not robotic
            pLerp[i] = 0.05 + Math.random() * 0.32;
        }
        for (let i = 0; i < particleCount * 3; i++) targetPos[i] = burstDest[i];

        burstPhase      = 'explode';
        burstPhaseStart = performance.now();

        // ── Phase 2: DRIFT ──
        setTimeout(() => {
            burstPhase      = 'drift';
            burstPhaseStart = performance.now();
            // Each particle lazily migrates to a nearby random position — zero-gravity feel
            for (let i = 0; i < particleCount; i++) {
                targetPos[i*3]     = burstDest[i*3]     + (Math.random() - 0.5) * 40;
                targetPos[i*3 + 1] = burstDest[i*3 + 1] + (Math.random() - 0.5) * 40;
                targetPos[i*3 + 2] = burstDest[i*3 + 2] + (Math.random() - 0.5) * 40;
                pLerp[i] = 0.002 + Math.random() * 0.006; // glacial — cinematic float
            }

            // ── Phase 3: REASSEMBLE ──
            setTimeout(() => {
                burstPhase      = 'reassemble';
                burstPhaseStart = performance.now();
                for (let i = 0; i < particleCount * 3; i++) targetPos[i] = savedHeartPos[i];
                // Staggered return — particles arrive at different moments, like a ballet
                for (let i = 0; i < particleCount; i++) {
                    pLerp[i] = 0.006 + Math.random() * 0.022;
                }

                // ── Done ──
                setTimeout(() => {
                    burstPhase = 'none';
                    for (let i = 0; i < particleCount; i++) pLerp[i] = 0.075;
                }, DUR_REASSEMBLE);
            }, DUR_DRIFT);
        }, DUR_EXPLODE);
    }

    // Click: cinematic double ripple + burst
    document.addEventListener('click', (e) => {
        if (!isHeartMode) return;

        // Inner ripple
        const r1 = document.createElement('div');
        r1.style.cssText = `position:fixed;z-index:10;pointer-events:none;
            border-radius:50%;border:4px solid rgba(255,105,180,0.9);
            left:${e.clientX}px;top:${e.clientY}px;
            transform:translate(-50%,-50%);
            animation:rippleOut 1.1s cubic-bezier(0.2,0.8,0.4,1) forwards;`;
        document.body.appendChild(r1);
        setTimeout(() => r1.remove(), 1200);

        // Outer slower ripple
        const r2 = document.createElement('div');
        r2.style.cssText = `position:fixed;z-index:10;pointer-events:none;
            border-radius:50%;border:2px solid rgba(255,20,147,0.45);
            left:${e.clientX}px;top:${e.clientY}px;
            transform:translate(-50%,-50%);
            animation:rippleOut2 1.8s cubic-bezier(0.1,0.9,0.3,1) forwards;`;
        document.body.appendChild(r2);
        setTimeout(() => r2.remove(), 1900);

        triggerBurst(e.clientX, e.clientY);
    });

    // ══════════════════════════════════════════════════
    //  5. TIMELINE SEQUENCER — poetic word reveal
    // ══════════════════════════════════════════════════
    const steps = [
        { text: 'Every',   scale: 1.1, duration: 1300 },
        { text: 'Moment',  scale: 1.0, duration: 1300 },
        { text: 'With',    scale: 1.2, duration: 1200 },
        { text: 'You',     scale: 1.3, duration: 1400 },
        { text: 'Is',      scale: 1.4, duration: 1100 },
        { text: 'Magic',   scale: 1.0, duration: 1600 },
        { text: '♥',       scale: 1.8, duration: 1000 },
        { heart: true, duration: 0 }
    ];

    let stepIndex   = 0;
    let isHeartMode = false;

    function nextStep() {
        if (stepIndex >= steps.length) return;
        const step = steps[stepIndex];
        stepIndex++; // increment ONCE here only

        if (step.heart) {
            isHeartMode = true;
            setTargetShape(getHeartPoints());
        } else {
            setTargetShape(getOffscreenPoints(step.text, step.scale));
        }

        if (step.duration > 0) {
            setTimeout(() => { nextStep(); }, step.duration);
        }
    }

    setTimeout(nextStep, 600);

    // ══════════════════════════════════════════════════
    //  6. FLOATING SPARKLES
    // ══════════════════════════════════════════════════
    const sparkleSymbols = ['♥','♡','✦','✿','★','💕','✨','❤'];

    function spawnSparkle() {
        const el = document.createElement('div');
        el.className = 'sparkle';
        el.textContent = sparkleSymbols[Math.floor(Math.random() * sparkleSymbols.length)];
        el.style.left     = Math.random() * 100 + 'vw';
        el.style.fontSize = (12 + Math.random() * 20) + 'px';
        const dur = 5 + Math.random() * 8;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay    = Math.random() * 4 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), (dur + 4) * 1000);
    }

    // Spawn sparkles periodically
    setInterval(spawnSparkle, 600);
    for (let i = 0; i < 15; i++) spawnSparkle(); // initial burst

    // ══════════════════════════════════════════════════
    //  7. SHOOTING STARS
    // ══════════════════════════════════════════════════
    function spawnShootingStar() {
        const el = document.createElement('div');
        el.className = 'shooting-star';
        el.style.top  = Math.random() * 60 + 'vh';
        el.style.left = (Math.random() * 40 - 20) + 'vw';
        el.style.transform = `rotate(${25 + Math.random()*20}deg)`;
        const dur = 1.2 + Math.random() * 1.5;
        el.style.animation = `shoot ${dur}s linear forwards`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 200);
    }

    setInterval(spawnShootingStar, 3500);
    setTimeout(spawnShootingStar, 800);

    // ══════════════════════════════════════════════════
    //  8. RENDER & ANIMATION LOOP
    // ══════════════════════════════════════════════════
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        drawMatrix();

        const time    = clock.getElapsedTime();
        const posAttr = geometry.attributes.position;
        const posArr  = posAttr.array;

        // ── Per-particle lerp — each particle moves at its own speed ──
        for (let i = 0; i < particleCount; i++) {
            const b = i * 3;
            posArr[b]     += (targetPos[b]     - posArr[b])     * pLerp[i];
            posArr[b + 1] += (targetPos[b + 1] - posArr[b + 1]) * pLerp[i];
            posArr[b + 2] += (targetPos[b + 2] - posArr[b + 2]) * pLerp[i];
        }

        // ── Particle size: swell during explosion, deflate during drift, recover on return ──
        const sizeTarget = burstPhase === 'explode'    ? 5.2 :
                           burstPhase === 'drift'      ? 3.8 :
                           burstPhase === 'reassemble' ? 3.2 : 2.8;
        material.size += (sizeTarget - material.size) * 0.06;
        material.needsUpdate = true;

        // ── Camera: pull back during burst, glide home on reassemble ──
        const camTarget = burstPhase === 'none' ? 100 :
                          burstPhase === 'drift' ? 130 : 118;
        camera.position.z += (camTarget - camera.position.z) * 0.025;

        // ── Heartbeat & rotation — suppressed during burst ──
        if (burstPhase === 'none') {
            if (isHeartMode) {
                // Organic dual-frequency heartbeat
                const beat = 1 + Math.sin(time * 2.4) * 0.05 + Math.sin(time * 4.8) * 0.02;
                particleSystem.scale.set(beat, beat, beat);
                particleSystem.rotation.y = Math.sin(time * 0.5)  * 0.18;
                particleSystem.rotation.x = Math.sin(time * 0.35) * 0.06;
            } else {
                const s = 1 + Math.sin(time * 3) * 0.04;
                particleSystem.scale.set(s, s, s);
                particleSystem.rotation.y = Math.sin(time * 1.2) * 0.08;
            }
        } else {
            // During burst: smoothly reset rotation & scale to neutral
            particleSystem.scale.x     += (1 - particleSystem.scale.x)     * 0.04;
            particleSystem.scale.y     += (1 - particleSystem.scale.y)     * 0.04;
            particleSystem.scale.z     += (1 - particleSystem.scale.z)     * 0.04;
            particleSystem.rotation.y  += (0 - particleSystem.rotation.y)  * 0.03;
            particleSystem.rotation.x  += (0 - particleSystem.rotation.x)  * 0.03;
        }

        updateColors(time);
        posAttr.needsUpdate = true;
        renderer.render(scene, camera);
    }

    animate();

    // ══════════════════════════════════════════════════
    //  9. RESIZE HANDLER
    // ══════════════════════════════════════════════════
    window.addEventListener('resize', () => {
        mWidth  = matrixCanvas.width  = window.innerWidth;
        mHeight = matrixCanvas.height = window.innerHeight;
        columns = Math.floor(mWidth / fontSize);
        drops   = Array(columns).fill(0).map(() => Math.random() * -80);

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    </script>
</body>
</html>
